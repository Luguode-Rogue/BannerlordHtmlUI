<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BannerlordHtmlUI Framework Test</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="panel">
    <h1>BannerlordHtmlUI</h1>
    <p id="status">Loading…</p>

    <section>
      <h2>Framework State</h2>
      <pre id="state">{}</pre>
    </section>

    <section class="actions">
      <button id="ping">Command / Ping</button>
      <button id="state-test">Set Test State</button>
      <button id="devtools">DevTools</button>
      <button id="reload">Reload</button>
      <button id="capture">Capture Input</button>
      <button id="release">Release Input</button>
    </section>

    <section>
      <h2>Last Event / Result</h2>
      <pre id="event">None</pre>
    </section>
  </main>

  <script src="/runtime.js"></script>
  <script src="/app.js"></script>
</body>
</html>
