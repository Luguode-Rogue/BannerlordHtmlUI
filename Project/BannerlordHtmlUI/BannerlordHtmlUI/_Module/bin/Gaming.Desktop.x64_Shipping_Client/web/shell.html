<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BannerlordHtmlUI Shell</title>
  <style>
    /* The shell is the single document that hosts surfaces. It must stay fully transparent:
       the framework relies on the overlay color key to reveal Bannerlord underneath. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #ui-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    /* Every surface is a full-viewport transparent layer. Surfaces position their own
       content with CSS inside their document; the framework never computes layout. */
    .bh-surface {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    /* Only the surface that currently owns input may receive pointer events.
       This is the v1 whole-window input policy: one owner at a time. */
    .bh-surface[data-input-owner="true"] {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="ui-root"></div>
  <script src="/runtime.js"></script>
  <script src="/shell.js"></script>
</body>
</html>
