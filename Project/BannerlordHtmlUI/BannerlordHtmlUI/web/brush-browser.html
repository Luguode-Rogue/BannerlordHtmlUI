<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bannerlord Brush Browser</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#eee}body{padding:24px;pointer-events:auto}
.panel{width:min(1280px,calc(100vw - 48px));height:calc(100vh - 48px);margin:auto;background:rgba(18,20,24,.97);border:1px solid rgba(255,255,255,.16);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
header,.toolbar{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}h1{margin:0;font-size:20px}.sub{margin-left:auto;opacity:.7;font-size:12px}
input,button{font:inherit}input{flex:1;min-width:0;padding:8px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff}button{padding:8px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}button:hover{background:rgba(255,255,255,.15)}button.active{background:rgba(110,160,255,.25);border-color:rgba(140,180,255,.45)}
main{min-height:0;flex:1;display:grid;grid-template-columns:340px 1fr}.list{min-height:0;overflow:auto;border-right:1px solid rgba(255,255,255,.08)}.item{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}.item:hover{background:rgba(255,255,255,.05)}.item.active{background:rgba(110,160,255,.16)}.name{font-size:13px;font-weight:600;word-break:break-word}.meta{margin-top:3px;font-size:11px;opacity:.62}
.detail{min-width:0;overflow:auto;padding:18px}.empty{opacity:.55;padding:40px;text-align:center}.demo{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-bottom:14px}.card{padding:12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.preview{min-height:180px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:repeating-conic-gradient(rgba(255,255,255,.05) 0% 25%,transparent 0% 50%) 50%/18px 18px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}.source-sheet{max-width:100%;max-height:180px;object-fit:contain;background:#111}.sprite-preview{display:inline-block;background-repeat:no-repeat;flex:0 0 auto}
.native-demo{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.game-button{min-width:280px;min-height:58px;border-radius:6px;padding:10px 18px;border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s ease,filter .08s ease}.game-button:hover{transform:translateY(-1px);filter:brightness(1.08)}.game-button:active{transform:translateY(1px)}
.states{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.state-caption{font-size:12px;opacity:.65}.state-status{font-size:11px;opacity:.7;min-height:15px}.exact{color:#9be29b}.fallback{color:#f0c77a}.error{color:#ff8d8d}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;opacity:.78}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.label{font-size:10px;opacity:.55;text-transform:uppercase;letter-spacing:.08em}.value{margin-top:4px;font-size:13px;word-break:break-word}
</style>
</head>
<body>
<div class="panel">
<header><h1>Bannerlord Brush Browser</h1><div class="sub" id="context">读取中...</div></header>
<div class="toolbar"><input id="filter" placeholder="搜索 Brush 名称，例如 ButtonBrush、CharacterDeveloper.SkillButtonBackground"><button id="refresh">刷新</button><button id="close">关闭</button></div>
<main><div class="list" id="list"><div class="empty">加载中...</div></div><div class="detail" id="detail"><div class="empty">选择一个 Brush</div></div></main>
</div>
<script>
let brushes=[],selected=null,currentBrush=null,stateProbe=[];const $=id=>document.getElementById(id);const GAME_STATES=['Default','Hovered','Pressed','Disabled'];
function capture(){try{window.focus();window.game?.input?.capture?.()}catch(_){} }
async function load(){capture();$('list').innerHTML='<div class="empty">加载中...</div>';try{const r=await window.game.request('framework.brush.list',{filter:$('filter').value.trim(),limit:300});brushes=r.brushes||[];$('context').textContent=r.available?`${r.contextName||'UIContext'} · ${r.total} Brush`:'没有可用 Gauntlet UIContext';renderList()}catch(e){$('context').textContent='读取失败';$('list').innerHTML=`<div class="empty">${escapeHtml(e?.message||String(e))}</div>`}}
async function selectBrush(name){capture();selected=name;currentBrush=null;stateProbe=[];renderList();$('detail').innerHTML='<div class="empty">读取 Brush 与真实 Gauntlet 状态...</div>';try{const r=await window.game.request('framework.brush.get',{name});currentBrush=r.brush;const p=await window.game.request('framework.brush.stateProbe',{name});stateProbe=p.states||[];renderDetail('Default')}catch(e){$('detail').innerHTML=`<div class="empty error">${escapeHtml(e?.message||String(e))}</div>`}}
function renderList(){if(!brushes.length){$('list').innerHTML='<div class="empty">没有匹配的 Brush</div>';return}$('list').innerHTML=brushes.map(b=>`<div class="item ${b.name===selected?'active':''}" data-name="${escapeAttr(b.name)}"><div class="name">${escapeHtml(b.name)}</div><div class="meta">Font ${Number(b.fontSize||0)}px · ${escapeHtml(b.fontStyle||'')}${b.styleNames?.length?` · ${b.styleNames.length} Styles`:''}</div></div>`).join('')}
function renderDetail(state){const b=currentBrush;const s=b?.sprite;const p=stateProbe.find(x=>x.state===state)||stateProbe[0];const st=p?.style;const preview=spriteMarkup(s);$('detail').innerHTML=`<h2 style="margin-top:0">${escapeHtml(b.name)}</h2><div class="demo"><div class="card"><div class="state-caption">原始 Sprite 资源</div><div class="preview">${s?.resourceUrl?`<img class="source-sheet" src="${escapeAttr(s.resourceUrl)}" alt="sprite sheet">`:''}${preview||'<div class="empty" style="padding:12px">Brush 没有 Sprite</div>'}</div></div><div class="card native-demo"><div class="state-caption">真实 Gauntlet 状态模拟</div><div id="gameButton" class="game-button"></div><div id="stateStatus" class="state-status"></div><div class="states">${GAME_STATES.map(x=>{const q=stateProbe.find(y=>y.state===x);return `<button class="state-btn ${state===x?'active':''}" data-state="${x}">${x}</button>`}).join('')}</div></div></div><div class="grid"><div class="card"><div class="label">Brush Color</div><div class="value">${escapeHtml(b.color||'')}</div></div><div class="card"><div class="label">Resolved Font Color</div><div class="value">${escapeHtml(st?.fontColor||b.fontColor||'')}</div></div><div class="card"><div class="label">Resolved Font</div><div class="value">${Number(st?.fontSize??b.fontSize??0)} px · ${escapeHtml(st?.fontStyle||b.fontStyle||'')}</div></div><div class="card"><div class="label">Resolved Style</div><div class="value">${escapeHtml(p?.resolvedStyleName||'')}</div></div><div class="card"><div class="label">Resolution</div><div class="value ${p?.exactStyle?'exact':'fallback'}">${p?.exactStyle?'命中该状态的独立 Style':'没有独立 Style，Gauntlet 回退到默认 Style'}</div></div><div class="card"><div class="label">Sprite Resource</div><div class="value ${s?.resourceError?'error':''}">${s?.resourceUrl?'已缓存并可由 WebView2 读取':(s?.resourceError||'无')}</div></div></div><div class="card" style="margin-top:12px"><div class="label">Game State Probe</div><pre>${escapeHtml(JSON.stringify(stateProbe,null,2))}</pre></div><div class="card" style="margin-top:12px"><div class="label">Brush Snapshot</div><pre>${escapeHtml(JSON.stringify(b,null,2))}</pre></div>`;document.querySelectorAll('.state-btn').forEach(btn=>{btn.addEventListener('pointerdown',capture,true);btn.addEventListener('click',()=>renderDetail(btn.dataset.state))});applyResolvedStyle(p?.style,b?.name);}
function applyResolvedStyle(style,name){const el=$('gameButton');if(!el)return;const bg=style?.layers?.find(x=>x?.sprite?.resourceUrl&&!x.hidden)?.sprite;const bgColor=style?.layers?.find(x=>x&&!x.hidden)?.color||currentBrush.color||'#666666FF';el.style.backgroundColor=cssColor(bgColor);el.style.color=cssColor(style?.fontColor||currentBrush.fontColor||'#FFFFFFFF');el.style.fontSize=((style?.fontSize??currentBrush.fontSize)||18)+'px';el.innerHTML='';if(bg){const img=document.createElement('div');img.className='sprite-preview';img.style.width=bg.width+'px';img.style.height=bg.height+'px';img.style.backgroundImage=`url("${escapeCssUrl(bg.resourceUrl)}")`;img.style.backgroundSize=`${bg.sheetWidth}px ${bg.sheetHeight}px`;img.style.backgroundPosition=`-${bg.sheetX}px -${bg.sheetY}px`;el.appendChild(img)}const text=document.createElement('span');text.textContent=name||currentBrush.name;el.appendChild(text);const p=stateProbe.find(x=>x.state===(document.querySelector('.state-btn.active')?.dataset.state||'Default'));$('stateStatus').innerHTML=p?(p.exactStyle?`<span class="exact">命中真实 Style：${escapeHtml(p.resolvedStyleName)}</span>`:`<span class="fallback">回退 Style：${escapeHtml(p.resolvedStyleName||'Default')}</span>`):''}
function spriteMarkup(s){if(!s?.resourceUrl||!s.width||!s.height)return'';return `<div class="sprite-preview" style="width:${s.width}px;height:${s.height}px;background-image:url('${escapeCssUrl(s.resourceUrl)}');background-size:${Number(s.sheetWidth||s.width)}px ${Number(s.sheetHeight||s.height)}px;background-position:-${Number(s.sheetX||0)}px -${Number(s.sheetY||0)}px"></div>`}
$('list').addEventListener('pointerdown',capture,true);$('list').addEventListener('click',e=>{const i=e.target.closest('.item');if(i)selectBrush(i.dataset.name)});$('refresh').addEventListener('pointerdown',capture,true);$('refresh').addEventListener('click',load);$('close').addEventListener('pointerdown',capture,true);$('close').addEventListener('click',()=>window.game.call('framework.closeCurrent'));$('filter').addEventListener('input',load);document.addEventListener('pointerdown',capture,true);window.addEventListener('load',load);
function cssColor(v){return v&&v.length===9?v:'#666666'}function escapeHtml(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function escapeAttr(v){return escapeHtml(v).replace(/'/g,'&#39;')}function escapeCssUrl(v){return String(v??'').replace(/\\/g,'/').replace(/\"/g,'%22').replace(/'/g,'%27')}
</script>
</body></html>
