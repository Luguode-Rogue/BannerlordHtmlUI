<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bannerlord Brush Browser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#eee;font-family:Arial,sans-serif}body{padding:24px}.panel{width:min(1400px,calc(100vw - 48px));height:calc(100vh - 48px);margin:auto;background:rgba(18,20,24,.97);border:1px solid rgba(255,255,255,.16);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}header,.toolbar{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}h1{margin:0;font-size:20px}.sub{margin-left:auto;opacity:.7;font-size:12px}input,button{font:inherit}input{flex:1;padding:8px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff}button{padding:8px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}button:hover{background:rgba(255,255,255,.15)}button.active{background:rgba(110,160,255,.25);border-color:rgba(140,180,255,.45)}main{min-height:0;flex:1;display:grid;grid-template-columns:340px 1fr}.list{min-height:0;overflow:auto;border-right:1px solid rgba(255,255,255,.08)}.item{padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}.item:hover{background:rgba(255,255,255,.05)}.item.active{background:rgba(110,160,255,.16)}.name{font-size:13px;font-weight:600;word-break:break-word}.meta{margin-top:3px;font-size:11px;opacity:.6}.detail{min-width:0;overflow:auto;padding:18px}.empty{opacity:.55;padding:40px;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:12px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}.preview{min-height:220px;margin-top:10px;border-radius:10px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(rgba(255,255,255,.05) 0 25%,transparent 0 50%) 50%/18px 18px}.preview img{max-width:100%;max-height:220px;image-rendering:auto}.states{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.game-button{min-height:56px;min-width:280px;margin:20px auto;padding:12px 18px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.16);border-radius:6px}.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.label{font-size:10px;opacity:.6}.value{margin-top:4px;font-size:12px;word-break:break-word}.progress{padding:7px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:11px;opacity:.7}.error{color:#ff8d8d}pre{white-space:pre-wrap;word-break:break-word;font-size:11px}.native-meta{font-size:11px;line-height:1.6;opacity:.8}.ok{color:#9dffb4}.warn{color:#ffd48a}
</style>
</head>
<body>
<div class="panel">
<header><h1>Bannerlord Brush Browser</h1><div class="sub" id="context">初始化...</div></header>
<div class="toolbar"><input id="filter" placeholder="搜索 Brush"><button id="refresh">刷新</button><button id="close">关闭</button></div>
<div class="progress" id="progress">检查 HTML UI Runtime...</div>
<main><div class="list" id="list"><div class="empty">等待 Runtime</div></div><div class="detail" id="detail"><div class="empty">选择一个 Brush</div></div></main>
</div>
<script>
(function(){
'use strict';
var brushes=[];var selectedName=null;var currentBrush=null;var currentStyle='Default';var currentResource=null;var nativeAsset=null;var loadToken=0;var pageReady=false;
var $=function(id){return document.getElementById(id);};
function text(el,value){if(el)el.textContent=value==null?'':String(value);}
function esc(v){var s=String(v==null?'':v);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');}
function escAttr(v){return esc(v).replace(/'/g,'&#39;');}
function showStatus(message,error){text($('progress'),message);$('progress').className='progress'+(error?' error':'');}
function capture(){try{if(window.focus)window.focus();if(window.game&&window.game.input&&window.game.input.capture)window.game.input.capture();}catch(e){}}
function renderList(){var list=$('list');if(!brushes.length){list.innerHTML='<div class="empty">没有匹配的 Brush</div>';return;}var h='';for(var i=0;i<brushes.length;i++){var b=brushes[i]||{};h+='<div class="item '+(b.name===selectedName?'active':'')+'" data-name="'+escAttr(b.name||'')+'"><div class="name">'+esc(b.name||'')+'</div><div class="meta">Font '+String(b.fontSize||0)+'px · '+esc(b.fontStyle||'')+'</div></div>';}list.innerHTML=h;}
function styleFor(name){if(name==='Default')return null;var styles=(currentBrush&&currentBrush.styles)||[];for(var i=0;i<styles.length;i++)if(styles[i]&&styles[i].name===name)return styles[i];return null;}
function cssColor(v){if(typeof v!=='string')return '#666';if(/^#[0-9a-fA-F]{8}$/.test(v))return '#'+v.substring(1,7);if(/^#[0-9a-fA-F]{6}$/.test(v))return v;return '#666';}
function applyStyle(name){var b=currentBrush;if(!b)return;var st=(currentResource&&currentResource.style)||styleFor(name);var el=$('gameButton');if(!el)return;el.style.backgroundColor=cssColor(b.color);el.style.color=cssColor(st&&st.fontColor?st.fontColor:b.fontColor);el.style.fontSize=String((st&&st.fontSize)||b.fontSize||18)+'px';text(el,b.name||'');text($('stateName'),name);text($('spriteState'),name);var btns=document.querySelectorAll('.state-btn');for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',btns[i].getAttribute('data-style')===name);}
function renderNativeAsset(){var box=$('nativeBox');if(!box)return;var a=nativeAsset;if(!a){box.innerHTML='<div class="empty">Native Atlas 未查询</div>';return;}var status=a.status||'unknown';var cls=status==='ready'?'ok':'warn';var h='<div class="native-meta"><b class="'+cls+'">'+esc(status)+'</b> · provider='+esc(a.provider||'none')+'<br>atlas='+esc(a.atlasName||'<none>')+'<br>path='+esc(a.atlasPath||'<none>');if(a.error)h+='<br><span class="error">'+esc(a.error)+'</span>';h+='</div>';if(a.spriteUrl)h+='<div class="preview"><img src="'+escAttr(a.spriteUrl)+'" alt="Native Sprite"></div>';if(a.atlasUrl)h+='<div style="margin-top:8px"><button id="showAtlas">显示原生 Atlas</button></div>';box.innerHTML=h;if(a.atlasUrl){$('showAtlas').addEventListener('click',function(){var w=window.open(a.atlasUrl,'_blank');if(w)w.focus();});}}
function renderResource(){var p=$('preview');var r=currentResource;var s=r&&r.sprite;var info=$('resourceInfo');if(!s){p.innerHTML='<div class="empty">没有 Sprite Resource</div>';text(info,r&&r.error?r.error:'资源未返回');return;}if(s.resourceUrl)p.innerHTML='<img src="'+escAttr(s.resourceUrl)+'" alt="Legacy Sprite">';else p.innerHTML='<div class="empty">没有 Legacy Sprite URL</div>';var d='Sprite Resource：'+esc(s.resourceSource||'')+'<br>Sheet '+String(s.sheetWidth||0)+'×'+String(s.sheetHeight||0)+' @ ('+String(s.sheetX||0)+', '+String(s.sheetY||0)+')<br>UV '+String(s.minU||0)+' → '+String(s.maxU||0)+' · '+String(s.minV||0)+' → '+String(s.maxV||0);if(s.pixelDiagnostics)d+='<br>'+esc(s.pixelDiagnostics);info.innerHTML=d;}
async function loadNative(){if(!currentBrush)return;nativeAsset=null;renderNativeAsset();showStatus('读取原生 Atlas 资源...');var token=selectedName;try{var r=await window.game.request('framework.brush.nativeAssetProbe',{name:token},30000);if(token!==selectedName)return;nativeAsset=r;renderNativeAsset();if(r.status==='ready')showStatus('原生 Atlas Sprite 已获得：'+r.atlasName);else showStatus('原生 Atlas 探针：'+String(r.status||'unknown'));}catch(e){if(token!==selectedName)return;nativeAsset={status:'error',error:e&&e.message?e.message:String(e)};renderNativeAsset();showStatus('原生 Atlas 查询失败',true);}}
async function loadResourceForState(state){if(!currentBrush)return;currentStyle=state;currentResource=null;applyStyle(state);showStatus('读取 Legacy Brush Resource：'+state);var token=selectedName;try{var r=await window.game.request('framework.brush.resource',{name:token,state:state},15000);if(token!==selectedName)return;currentResource=r;applyStyle(state);renderResource();showStatus('Legacy Brush Resource 已返回：'+state);}catch(e){if(token!==selectedName)return;currentResource={error:e&&e.message?e.message:String(e)};applyStyle(state);renderResource();showStatus('Legacy Brush Resource 读取失败',true);}}
function renderDetail(){var d=$('detail');if(!currentBrush){d.innerHTML='<div class="empty">选择一个 Brush</div>';return;}var b=currentBrush;var styles=b.styles||[];var h='<h2 style="margin-top:0">'+esc(b.name||'')+'</h2>';h+='<div class="grid">';h+='<div class="card"><div>Legacy Sprite Preview · <b id="spriteState">Default</b></div><div class="preview" id="preview"><div class="empty">等待资源</div></div><div id="resourceInfo" style="margin-top:10px"></div></div>';h+='<div class="card"><div>HTML Brush Preview · <b id="stateName">Default</b></div><div class="game-button" id="gameButton">'+esc(b.name||'')+'</div><div class="states" id="states"></div></div>';h+='</div>';h+='<div class="card" style="margin-top:14px"><div><b>Native Atlas Asset · 第一阶段目标</b></div><div id="nativeBox" style="margin-top:10px"><div class="empty">等待探针</div></div></div>';h+='<div class="kv"><div class="card"><div class="label">Color</div><div class="value">'+esc(b.color||'')+'</div></div><div class="card"><div class="label">Font Color</div><div class="value">'+esc(b.fontColor||'')+'</div></div><div class="card"><div class="label">Font</div><div class="value">'+String(b.fontSize||0)+' px · '+esc(b.fontStyle||'')+'</div></div><div class="card"><div class="label">Sprite</div><div class="value">'+(b.sprite?esc((b.sprite.name||'')+' · '+String(b.sprite.width||0)+'×'+String(b.sprite.height||0)):'无')+'</div></div></div>';h+='<div class="card" style="margin-top:12px"><div class="label">Snapshot</div><pre>'+esc(JSON.stringify(b,null,2))+'</pre></div>';d.innerHTML=h;var states=$('states');var names=['Default'];for(var i=0;i<styles.length;i++)if(styles[i]&&styles[i].name&&names.indexOf(styles[i].name)<0)names.push(styles[i].name);for(var j=0;j<names.length;j++){var btn=document.createElement('button');btn.type='button';btn.className='state-btn'+(names[j]===currentStyle?' active':'');btn.setAttribute('data-style',names[j]);btn.textContent=names[j];btn.addEventListener('click',(function(name){return function(){currentStyle=name;loadResourceForState(name);};})(names[j]));states.appendChild(btn);}applyStyle('Default');}
async function selectBrush(name){capture();selectedName=name;currentBrush=null;currentResource=null;nativeAsset=null;currentStyle='Default';renderList();$('detail').innerHTML='<div class="empty">读取 Brush 元数据...</div>';showStatus('读取 Brush：'+name);try{var r=await window.game.request('framework.brush.get',{name:name},15000);if(name!==selectedName)return;currentBrush=r.brush;renderDetail();loadNative();loadResourceForState('Default');}catch(e){if(name!==selectedName)return;$('detail').innerHTML='<div class="empty error">'+esc(e&&e.message?e.message:String(e))+'</div>';showStatus('Brush 读取失败',true);}}
async function load(){var token=++loadToken;capture();brushes=[];selectedName=null;currentBrush=null;renderList();showStatus('正在加载 Brush 列表...');try{var filter=$('filter').value.trim();var offset=0;var total=0;while(true){if(token!==loadToken)return;var r=await window.game.request('framework.brush.list',{filter:filter,limit:25,offset:offset},15000);if(token!==loadToken)return;var page=r&&r.brushes?r.brushes:[];if(!offset)total=Number(r&&r.total||0);for(var i=0;i<page.length;i++)brushes.push(page[i]);renderList();text($('context'),r&&r.available?(r.contextName||'UIContext')+' · '+String(total)+' Brush':'无 UIContext');text($('progress'),'已加载 '+String(brushes.length)+'/'+String(total||brushes.length));if(!r||!r.hasMore||!page.length)break;offset+=page.length;await new Promise(function(resolve){setTimeout(resolve,0);});}showStatus('加载完成 · '+String(brushes.length)+' Brush');}catch(e){showStatus('加载失败：'+(e&&e.message?e.message:String(e)),true);$('list').innerHTML='<div class="empty error">'+esc(e&&e.message?e.message:String(e))+'</div>';}}
function startup(){if(pageReady)return;pageReady=true;if(!window.game||typeof window.game.request!=='function'){showStatus('HTML UI Runtime 未就绪',true);return;}showStatus('HTML UI Runtime 已就绪');load();}
$('list').addEventListener('click',function(e){var item=e.target.closest?e.target.closest('.item'):null;if(item)selectBrush(item.getAttribute('data-name'));});$('refresh').addEventListener('click',load);$('close').addEventListener('click',function(){try{window.game.call('framework.closeCurrent');}catch(e){}});$('filter').addEventListener('input',function(){clearTimeout(window.__brushTimer);window.__brushTimer=setTimeout(load,250);});window.addEventListener('error',function(e){showStatus('页面 JS 错误：'+String(e&&e.message||e),true);});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startup);else startup();
})();
</script>
</body>
</html>
