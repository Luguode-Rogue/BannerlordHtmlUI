<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HtmlUI Stress Lab</title>
<style>
body{font-family:sans-serif;background:#11151a;color:#eee;margin:20px}
button,input{padding:8px;margin:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
pre{background:#080a0d;padding:12px;white-space:pre-wrap;min-height:120px}
#bench{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:12px}
.cell{height:8px;background:#2d343b}
</style>
</head>
<body>
<h1>HtmlUI M6 Stress Lab</h1>
<div class="row">
  <button id="one">Run 1</button>
  <button id="ten">Run 10</button>
  <button id="fifty">Run 50</button>
  <button id="binder">Binder 生命周期</button>
  <button id="stop">Stop</button>
  <button id="snapshot">Snapshot</button>
</div>
<div id="bench"></div>
<pre id="log">idle</pre>
<script>
const app=window.game.app;
const logEl=document.getElementById('log');
const bench=document.getElementById('bench');
let stopRequested=false;
let running=false;
const log=v=>logEl.textContent=JSON.stringify(v,null,2);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const snapshot=()=>app.request('framework.getDiagnostics');
function renderCells(count){
  bench.textContent='';
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='cell';
    bench.appendChild(el);
  }
}
async function componentRound(count){
  const hosts=[];
  const disposers=[];
  for(let i=0;i<count;i++){
    if(stopRequested) break;
    const host=document.createElement('div');
    host.className='componentHost';
    bench.appendChild(host);
    hosts.push(host);
    const handle=app.bind.component(host,({index},root)=>{
      root.dataset.stressIndex=String(index);
      const span=document.createElement('span');
      span.textContent='stress';
      root.appendChild(span);
      return {element:root,update(){span.textContent='stress'},dispose(){span.remove()}};
    },{index:i});
    disposers.push(handle);
  }
  await sleep(0);
  for(const handle of disposers) handle.dispose();
  for(const host of hosts) host.remove();
}
async function binderLifecycleRound(){
  const binder=window.game.scope('HtmlUiConsumerTestMod').bind;
  const host=document.createElement('div');
  const listHost=document.createElement('div');
  const templateHost=document.createElement('div');
  host.className='componentHost';
  listHost.className='listHost';
  templateHost.className='templateHost';
  bench.append(host,listHost,templateHost);

  let componentDisposed=false;
  let listDisposed=0;
  let templateDisposed=0;

  binder.component(host,(_props,root)=>{
    const child=document.createElement('span');
    child.textContent='component';
    root.appendChild(child);
    return {element:root,dispose(){componentDisposed=true;child.remove()}};
  },{});

  // The default consumer test State does not necessarily contain an array on every
  // page, so list/template are still exercised through their empty-state lifecycle.
  binder.list(listHost,'stressItems',item=>{
    const child=document.createElement('span');
    child.textContent=String(item?.id ?? item ?? 'item');
    return {element:child,dispose(){listDisposed++}};
  },{key:item=>item?.id ?? item});

  binder.template(templateHost,'stressItems',item=>{
    const child=document.createElement('span');
    child.textContent=String(item?.id ?? item ?? 'item');
    return {element:child,dispose(){templateDisposed++}};
  },{key:item=>item?.id ?? item});

  await sleep(0);
  const before={
    componentChildren:host.childElementCount,
    listChildren:listHost.childElementCount,
    templateChildren:templateHost.childElementCount
  };

  binder.dispose();

  const after={
    componentChildren:host.childElementCount,
    listChildren:listHost.childElementCount,
    templateChildren:templateHost.childElementCount,
    componentDisposed,
    listDisposed,
    templateDisposed
  };

  host.remove();
  listHost.remove();
  templateHost.remove();
  return {before,after};
}
async function cancellableRound(count){
  const jobs=[];
  for(let i=0;i<count;i++){
    if(stopRequested) break;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort('stress cancel'),15+(i%4)*5);
    jobs.push(app.requestCancellable('getDataCancellable',{echo:'stress-'+i},5000,controller.signal)
      .catch(e=>({aborted:e.code==='REQUEST_ABORTED',code:e.code}))
      .finally(()=>clearTimeout(timer)));
  }
  return Promise.all(jobs);
}
async function requestRound(count){
  const jobs=[];
  for(let i=0;i<count;i++){
    if(stopRequested) break;
    jobs.push(app.request('getData',{echo:'stress-'+i}));
  }
  return Promise.all(jobs);
}
async function runRound(round){
  const before=await snapshot();
  renderCells(100);
  await componentRound(50);
  await requestRound(20);
  const canceled=await cancellableRound(20);
  const after=await snapshot();
  return {
    round,
    domChildren:bench.childElementCount,
    before:{pages:before.pageCount,states:before.stateCount,commands:before.bridgeCommandCount,requests:before.bridgeRequestCount,activeRequests:before.activeRequestCount},
    after:{pages:after.pageCount,states:after.stateCount,commands:after.bridgeCommandCount,requests:after.bridgeRequestCount,activeRequests:after.activeRequestCount},
    canceled:canceled.filter(x=>x&&x.aborted).length
  };
}
async function run(count){
  if(running) return;
  running=true;
  stopRequested=false;
  const started=performance.now();
  const results=[];
  try{
    for(let i=1;i<=count;i++){
      if(stopRequested) break;
      results.push(await runRound(i));
      log({status:'running',completed:i,target:count,last:results[results.length-1]});
      await sleep(10);
    }
    const final=await snapshot();
    log({status:stopRequested?'stopped':'complete',elapsedMs:Math.round(performance.now()-started),domChildren:bench.childElementCount,final:{pages:final.pageCount,states:final.stateCount,commands:final.bridgeCommandCount,requests:final.bridgeRequestCount,activeRequests:final.activeRequestCount},results});
  }catch(e){
    log({status:'error',name:e.name,code:e.code,message:e.message,results});
  }finally{
    running=false;
    stopRequested=false;
    bench.textContent='';
  }
}
document.getElementById('one').onclick=()=>run(1);
document.getElementById('ten').onclick=()=>run(10);
document.getElementById('fifty').onclick=()=>run(50);
document.getElementById('binder').onclick=async()=>{try{log({status:'binder lifecycle',result:await binderLifecycleRound()})}catch(e){log({status:'binder lifecycle error',name:e.name,code:e.code,message:e.message})}};
document.getElementById('stop').onclick=()=>{stopRequested=true};
document.getElementById('snapshot').onclick=async()=>{try{log(await snapshot())}catch(e){log({error:{name:e.name,code:e.code,message:e.message}})}};
window.addEventListener('pagehide',()=>{stopRequested=true},{once:true});
</script>
</body>
</html>
