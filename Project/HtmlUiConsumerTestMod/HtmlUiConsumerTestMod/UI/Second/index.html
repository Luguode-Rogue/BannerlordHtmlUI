<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Overlay HUD</title>
<style>
/* 关键：body 全透明，游戏画面透过（WebView2 背景由 Transparent=true 设为透明） */
*{box-sizing:border-box}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:transparent !important;overflow:hidden;font-family:'Segoe UI',sans-serif;
  /* Passive 模式：整个窗口鼠标穿透，仅视觉展示 */
}

/* 纯代码星空背景层：铺满整个 overlay 窗口，透明区域可见，不影响 HUD */
#fx-stars{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;opacity:.9;
}

/* 右下角 Overlay HUD 面板：半透明 + 圆角 + 局部 */
#hud{
  position:fixed;right:24px;bottom:24px;width:300px;
  background:rgba(12,18,28,.72);backdrop-filter:blur(10px);
  border:1px solid rgba(120,160,220,.35);border-radius:14px;
  padding:14px 16px;color:#e8ecf3;
  box-shadow:0 10px 34px rgba(0,0,0,.5);
  user-select:none;
}

/* HUD 标题 */
#hud h2{
  margin:0 0 10px;font-size:14px;font-weight:700;color:#8fc9ff;letter-spacing:1px;
  text-shadow:0 0 12px rgba(79,180,255,.5);
}

/* 资源条（HP / MP / 耐力） */
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.bar .lbl{width:34px;color:#9fb6d8;text-align:right;font-weight:600}
.bar .track{flex:1;height:12px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1);width:0}
.fill.hp{background:linear-gradient(90deg,#ff5a5a,#ff8a5a)}
.fill.mp{background:linear-gradient(90deg,#4f7bff,#5ad0ff)}
.fill.st{background:linear-gradient(90deg,#6bcf57,#b8ff6b)}
.bar .val{width:30px;text-align:right;color:#cdd9ef;font-variant-numeric:tabular-nums}

/* 迷你小地图占位 */
#minimap{
  margin-top:10px;height:96px;border-radius:10px;
  background:radial-gradient(circle at 30% 30%, #20334d 0%, #0d1624 70%);
  border:1px solid rgba(120,160,220,.25);position:relative;overflow:hidden;
}
#minimap .dot{position:absolute;width:6px;height:6px;border-radius:50%}
#minimap .blink{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#minimap .arrow{
  position:absolute;font-size:16px;line-height:1;color:#8fc9ff;
  text-shadow:0 0 8px rgba(143,201,255,.7);
  animation:float 2.5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* Passive 提示 */
#hud .hint{margin-top:8px;font-size:11px;color:#8fa9c7;text-align:center}

/* 顶部返回小胶囊（视觉） */
#corner-tag{
  position:fixed;top:16px;right:16px;
  font-size:11px;padding:6px 12px;border-radius:20px;
  background:rgba(12,18,28,.6);border:1px solid rgba(120,160,220,.25);color:#9fc4ea;
  letter-spacing:.5px;
}
</style>
</head>
<body>
<canvas id="fx-stars"></canvas>
<div id="corner-tag">◈ Overlay · Passive</div>

<div id="hud">
  <h2 data-bhui-i18n="HtmlUiSecond_Title"></h2>

  <div class="bar"><span class="lbl">HP</span><div class="track"><div class="fill hp" id="hpFill"></div></div><span class="val" id="hpVal">0</span></div>
  <div class="bar"><span class="lbl">MP</span><div class="track"><div class="fill mp" id="mpFill"></div></div><span class="val" id="mpVal">0</span></div>
  <div class="bar"><span class="lbl">STA</span><div class="track"><div class="fill st" id="stFill"></div></div><span class="val" id="stVal">0</span></div>

  <div id="minimap">
    <div class="dot blink" style="left:20%;top:30%;background:#7ff3b0"></div>
    <div class="dot blink" style="left:55%;top:60%;background:#ff7b6b"></div>
    <div class="dot blink" style="left:75%;top:25%;background:#ffd76b"></div>
    <div class="arrow" style="left:47%;top:40%">▲</div>
    <div class="dot" style="left:46%;top:64%;background:#5ad0ff;width:8px;height:8px"></div>
  </div>

  <div class="hint" data-bhui-i18n="HtmlUiSecond_Hint"></div>
</div>

<script>
const app = window.game.app;

// 模拟战场资源随时间波动（纯前端演示 Overlay 展示能力）
const set = (id, pct, val) => {
  document.getElementById(id).style.width = pct + '%';
  document.getElementById(id + 'Val').textContent = val;
};
let t = 0;
setInterval(() => {
  t++;
  const hp = Math.max(15, 100 - (t * 0.4) % 90);
  const mp = 30 + Math.sin(t / 5) * 25;
  const st = 55 + Math.sin(t / 7) * 35;
  set('hpFill', hp, Math.round(hp));
  set('mpFill', mp, Math.round(mp));
  set('stFill', st, Math.round(st));
}, 120);

// Scoped state 隔离验证
app.state.subscribe('secondCount', (v) => {
  // 用 secondCount 影响 HP 条，展示 State -> HUD
  if (v != null) set('hpFill', Math.min(100, 50 + v * 8), Math.round(Math.min(100, 50 + v * 8)));
});
app.state.subscribe('counter', (v) => {}); // 跨页隔离观察（不改变本页 HUD）

app.pageLifecycle.on((p) => {});

/* ============================================================
   纯代码随机闪烁星空
   - 随机星星：位置 / 大小 / 闪烁相位 / 颜色
   - 每颗星独立 alpha 闪烁（正弦，随机频率）
   - 慢速漂移 + 偶发流星
   ============================================================ */
(function starfield(){
  const cv = document.getElementById('fx-stars');
  if (!cv || typeof cv.getContext !== 'function') return;
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const stars = [];
  const colors = ['255,255,255', '180,220,255', '255,235,180', '200,255,240', '255,190,220'];
  let meteors = [];

  const resize = () => {
    W = cv.width = cv.offsetWidth || window.innerWidth;
    H = cv.height = cv.offsetHeight || window.innerHeight;
  };
  resize();
  addEventListener('resize', resize);

  // 随机生成 ~90 颗星
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random(),            // 相对位置（0~1）
      y: Math.random(),
      r: (0.4 + Math.random() * 1.6) * 5,
      phase: Math.random() * Math.PI * 2,
      freq: 0.5 + Math.random() * 2.2,   // 闪烁频率
      base: 0.25 + Math.random() * 0.45, // 基础亮度
      color: colors[Math.floor(Math.random() * colors.length)],
      driftX: (Math.random() - 0.5) * 0.02,
      driftY: (Math.random() - 0.5) * 0.02,
      tw: Math.random() < 0.15  // 少数有十字芒星
    });
  }

  // 流星生成
  const maybeSpawnMeteor = () => {
    if (meteors.length < 2 && Math.random() < 0.012) {
      meteors.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.4,
        vx: (2 + Math.random() * 3) * (Math.random() < 0.5 ? 1 : -1),
        vy: 1.2 + Math.random() * 2,
        life: 1,
        r: (1 + Math.random()) * 2.5
      });
    }
  };

  const t0 = performance.now();
  const loop = (now) => {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);

    for (const s of stars) {
      // 相对坐标 -> 像素 + 漂移
      const px = (s.x + t * s.driftX) % 1 * W;
      const py = (s.y + t * s.driftY) % 1 * H;
      // 随机闪烁
      const tw = s.base + (Math.sin(t * s.freq + s.phase) * 0.5 + 0.5) * (1 - s.base);
      const a = Math.max(0.05, Math.min(1, tw));

      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgb(' + s.color + ')';
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();

      // 十字芒星
      if (s.tw && a > 0.7) {
        ctx.strokeStyle = 'rgb(' + s.color + ')';
        ctx.lineWidth = 0.6;
        ctx.globalAlpha = a * 0.7;
        ctx.beginPath();
        ctx.moveTo(px - 10, py); ctx.lineTo(px + 10, py);
        ctx.moveTo(px, py - 10); ctx.lineTo(px, py + 10);
        ctx.stroke();
      }
    }

    // 流星
    maybeSpawnMeteor();
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx; m.y += m.vy; m.life -= 0.015;
      if (m.life <= 0 || m.y > H) { meteors.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, m.life);
      ctx.strokeStyle = 'rgba(220,240,255,' + Math.max(0, m.life) + ')';
      ctx.lineWidth = m.r;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.vx * 18, m.y - m.vy * 18);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
