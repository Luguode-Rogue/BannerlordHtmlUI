<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML UI 框架测试</title>
<style>
body{font-family:sans-serif;background:#16181d;color:#eee;margin:24px}
button,input{padding:8px;margin:4px}
.card{background:#222831;padding:16px;border-radius:8px;margin-bottom:12px}
pre{background:#0d0f12;padding:12px;min-height:80px;white-space:pre-wrap}
.muted{opacity:.7;font-size:12px}
</style>
</head>
<body>
<h1 data-bhui-i18n="HtmlUiConsumer_Title"></h1>
<div class="card">
  <div id="counterText"></div>
  <button id="inc" data-bhui-i18n="HtmlUiConsumer_Increment"></button>
  <button id="get" data-bhui-i18n="HtmlUiConsumer_GetData"></button>
</div>
<div class="card">
  <label><span data-bhui-i18n="HtmlUiConsumer_Name"></span> <input id="name"></label><br>
  <label><input id="enabled" type="checkbox"> <span data-bhui-i18n="HtmlUiConsumer_Enabled"></span></label>
  <button id="removeNameState" data-bhui-i18n="HtmlUiConsumer_RemoveNameState"></button>
</div>
<div class="card">
  <button id="release" data-bhui-i18n="HtmlUiConsumer_Release"></button>
  <button id="capture" data-bhui-i18n="HtmlUiConsumer_Capture"></button>
  <button id="reloadRace" data-bhui-i18n="HtmlUiConsumer_ReloadRace"></button>
  <button id="close" data-bhui-i18n="HtmlUiConsumer_Close"></button>
  <div class="muted" data-bhui-i18n="HtmlUiConsumer_EscHint"></div>
</div>
<div class="card">
  <strong data-bhui-i18n="HtmlUiConsumer_M5Title"></strong><br>
  <button id="eventTest" data-bhui-i18n="HtmlUiConsumer_Event"></button>
  <button id="delayTest" data-bhui-i18n="HtmlUiConsumer_DelayedRequest"></button>
  <button id="cancelTest" data-bhui-i18n="HtmlUiConsumer_CancellableRequest"></button>
  <button id="commandErrorTest" data-bhui-i18n="HtmlUiConsumer_CommandError"></button>
  <button id="requestErrorTest" data-bhui-i18n="HtmlUiConsumer_RequestError"></button>
  <button id="snapshotTest" data-bhui-i18n="HtmlUiConsumer_DiagnosticsSnapshot"></button>
</div>
<pre id="log">加载中...</pre>
<pre id="err"></pre>
<script>
const app=window.game.app;
const logEl=document.getElementById('log');
const errEl=document.getElementById('err');
const log=v=>logEl.textContent=JSON.stringify(v,null,2);
const renderCounter=async value=>{
  document.getElementById('counterText').textContent=
    await app.i18n.t('HtmlUiConsumer_Counter',{COUNT:value??0});
};
app.state.subscribe('counter',renderCounter);
app.state.subscribe('name',value=>{
  document.getElementById('name').value=value==null?'':String(value);
});
app.bind.twoWayValue('#name','name',v=>app.call('setName',{value:v}),{event:'input',debounce:120});
app.bind.twoWayChecked('#enabled','enabled',v=>app.call('setEnabled',{value:v}));
app.on('counterChanged',d=>log({event:d}));
app.on('testEvent',d=>log({event:d}));
app.errors.on(e=>errEl.textContent=JSON.stringify(e,null,2));
app.page.onLifecycle(state=>log({pageLifecycle:state}));

document.getElementById('inc').onclick=async()=>{try{log({command:await app.call('increment',{})})}catch(e){log({error:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('get').onclick=async()=>{try{log({request:await app.request('getData',{echo:'hello'})})}catch(e){log({error:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('removeNameState').onclick=async()=>{try{log({removeState:await app.call('removeNameState',{})})}catch(e){log({error:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('eventTest').onclick=async()=>{try{log({eventRequest:await app.call('emitTestEvent',{message:'Event round-trip'})})}catch(e){log({error:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('delayTest').onclick=async()=>{try{log({delayedRequest:await app.request('getDataDelayed',{echo:'50ms'})})}catch(e){log({error:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('cancelTest').onclick=async()=>{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort('consumer test cancel'),120);
  try{
    log({cancelRequest:'started'});
    await app.requestCancellable('getDataCancellable',{echo:'abort-me'},10000,controller.signal);
    log({unexpected:'cancellable request completed'});
  }catch(e){
    log({cancellableRequest:{name:e.name,code:e.code,message:e.message}});
  }finally{
    clearTimeout(timer);
  }
};
document.getElementById('commandErrorTest').onclick=async()=>{try{await app.call('throwCommand');log({unexpected:'command did not fail'})}catch(e){log({expectedCommandError:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('requestErrorTest').onclick=async()=>{try{await app.request('throwRequest');log({unexpected:'request did not fail'})}catch(e){log({expectedRequestError:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('snapshotTest').onclick=async()=>{try{log({diagnostics:await app.request('framework.getDiagnostics')})}catch(e){log({diagnosticsError:{name:e.name,code:e.code,message:e.message}})}};
document.getElementById('release').onclick=()=>app.input.release();
document.getElementById('capture').onclick=()=>app.input.capture();
document.getElementById('reloadRace').onclick=async()=>{
  try{
    const pageId=app.page&&app.page.id;
    if(!pageId){log({reloadRace:'no current page'});return;}
    const first=app.pages.open(pageId);
    const second=app.pages.open(pageId);
    const results=await Promise.allSettled([first,second]);
    log({reloadRace:'completed',results:results.map(r=>r.status==='fulfilled'?{status:r.status,value:r.value}:{status:r.status,reason:String(r.reason)})});
  }catch(e){log({reloadRaceError:{name:e.name,code:e.code,message:e.message}})}
};
document.getElementById('close').onclick=()=>app.pages.close();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();app.pages.close();}});

let i18nBindingDispose=null;
async function applyLocalization(){
  if(i18nBindingDispose){
    try{i18nBindingDispose();}catch(_){ }
    i18nBindingDispose=null;
  }
  i18nBindingDispose=await app.i18n.bind();
  await renderCounter(app.state.get('counter')||0);
}
applyLocalization().catch(e=>log({i18nBindError:String(e)}));
window.addEventListener('pagehide',()=>{
  if(i18nBindingDispose){
    try{i18nBindingDispose();}catch(_){ }
    i18nBindingDispose=null;
  }
},{once:true});
</script>
</body>
</html>
